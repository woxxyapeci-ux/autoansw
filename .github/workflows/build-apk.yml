name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Generate Compatible Gradle & Build APK
      run: |
        if [ -d "WoView_Project" ]; then
          cd WoView_Project
        fi
        gradle wrapper --gradle-version 8.0.2
        ./gradlew assembleDebug

    - name: Locate & Prepare APK
      run: |
        APK_PATH=$(find . -name "app-debug.apk" | head -n 1)
        if [ -n "$APK_PATH" ]; then
          mkdir -p output_apk
          cp "$APK_PATH" output_apk/woview.apk
        else
          echo "File APK tidak ditemukan!"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: woview-apk
        path: output_apk/woview.apk
