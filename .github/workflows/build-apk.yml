name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build AI-LATIHAN APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Show project files
        run: |
          echo "=== Project files ==="
          ls -la
          echo "=== App directory ==="
          ls -la app || true
          echo "=== Gradle files ==="
          find . -maxdepth 2 -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check Gradle
        run: ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "=== APK files ==="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-LATIHAN-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
