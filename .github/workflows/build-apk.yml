name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build APK Otomatis
      run: |
        # Mencari folder tempat settings.gradle berada secara otomatis
        TARGET_DIR=$(find . -name "settings.gradle" -exec dirname {} \; | head -n 1)
        echo "Proyek ditemukan di folder: $TARGET_DIR"
        
        cd "$TARGET_DIR"
        gradle wrapper --gradle-version 8.0.2
        ./gradlew assembleDebug

    - name: Kumpulkan File APK
      run: |
        APK_FILE=$(find . -name "app-debug.apk" | head -n 1)
        if [ -n "$APK_FILE" ]; then
          mkdir -p output
          cp "$APK_FILE" output/woview.apk
          echo "Berhasil menemukan APK di: $APK_FILE"
        else
          echo "File APK tidak ditemukan!"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: woview-apk
        path: output/woview.apk
