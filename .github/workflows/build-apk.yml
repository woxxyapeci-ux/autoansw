name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build and Package APK
      run: |
        echo "=== Memeriksa Struktur Folder ==="
        ls -la
        
        # Cari lokasi folder yang berisi settings.gradle
        PROJ_DIR=$(find . -name "settings.gradle" -exec dirname {} \; | head -n 1)
        
        if [ -z "$PROJ_DIR" ]; then
          echo "ERROR: File settings.gradle tidak ditemukan di repositori!"
          exit 1
        fi
        
        echo "=== Masuk ke Folder Proyek: $PROJ_DIR ==="
        cd "$PROJ_DIR"
        
        echo "=== Membuat Gradle Wrapper ==="
        gradle wrapper --gradle-version 8.0.2
        chmod +x gradlew
        
        echo "=== Memulai Build APK ==="
        ./gradlew assembleDebug
        
        echo "=== Menyimpan Hasil APK ==="
        mkdir -p $GITHUB_WORKSPACE/output
        cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/output/woview.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: woview-apk
        path: output/woview.apk
